<!DOCTYPE html>
<html>

<head>
    <title>Gavero H3 Explorer</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #070d1a;
            --surface: rgba(10, 20, 40, 0.92);
            --border: rgba(56, 189, 248, 0.15);
            --accent: #38bdf8;
            --accent2: #818cf8;
            --green: #10b981;
            --red: #f43f5e;
            --amber: #f59e0b;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        /* Sidebar */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            z-index: 1000;
            background: var(--surface);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.05), rgba(129, 140, 248, 0.05));
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .app-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            font-family: var(--mono);
            letter-spacing: 0.05em;
        }

        /* Global stats strip */
        .stats-strip {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-bottom: 1px solid var(--border);
        }

        .stat-cell {
            padding: 12px 10px;
            text-align: center;
            border-right: 1px solid var(--border);
        }

        .stat-cell:last-child {
            border-right: none;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
            font-family: var(--mono);
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        /* City list */
        .section-title {
            padding: 12px 18px 6px;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-family: var(--mono);
        }

        .city-list {
            overflow-y: auto;
            flex: 1;
        }

        .city-item {
            padding: 12px 18px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.06);
            cursor: pointer;
            transition: background 0.15s;
        }

        .city-item:hover {
            background: rgba(56, 189, 248, 0.06);
        }

        .city-item.selected {
            background: rgba(56, 189, 248, 0.1);
            border-left: 3px solid var(--accent);
        }

        .city-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .city-badge {
            font-size: 0.6rem;
            font-family: var(--mono);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }

        .badge-inactive {
            background: rgba(244, 63, 94, 0.15);
            color: var(--red);
        }

        .badge-partial {
            background: rgba(245, 158, 11, 0.15);
            color: var(--amber);
        }

        .city-meta {
            font-size: 0.72rem;
            color: var(--muted);
            font-family: var(--mono);
            margin-top: 4px;
            display: flex;
            gap: 12px;
        }

        .zone-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .zone-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--green), var(--accent));
        }

        /* Zone detail panel */
        #detail-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 270px;
            z-index: 1000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(20px);
            display: none;
            overflow: hidden;
        }

        .detail-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(129, 140, 248, 0.05));
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            font-family: var(--mono);
        }

        #close-detail {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: color 0.15s;
        }

        #close-detail:hover {
            color: var(--text);
        }

        .detail-body {
            padding: 14px 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-key {
            color: var(--muted);
            font-family: var(--mono);
        }

        .detail-val {
            color: var(--text);
            font-weight: 600;
            font-family: var(--mono);
        }

        /* Top bar */
        #topbar {
            position: absolute;
            top: 12px;
            left: 340px;
            right: 290px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-size: 0.72rem;
            font-family: var(--mono);
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Pulse dot */
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .pulse-green {
            background: var(--green);
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse-g 2s infinite;
        }

        .pulse-red {
            background: var(--red);
        }

        @keyframes pulse-g {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* Leaflet popup override */
        .leaflet-popup-content-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            backdrop-filter: blur(20px);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.75rem;
            padding: 0;
        }

        .leaflet-popup-content {
            margin: 12px 14px;
        }

        .leaflet-popup-tip {
            background: var(--surface);
        }

        .leaflet-popup-close-button {
            color: var(--muted) !important;
            top: 6px !important;
            right: 8px !important;
        }

        /* Scrollbar */
        .city-list::-webkit-scrollbar {
            width: 4px;
        }

        .city-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .city-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* Legend */
        #legend {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 1000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(20px);
            font-size: 0.7rem;
            font-family: var(--mono);
        }

        .legend-title {
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-size: 0.62rem;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            color: var(--text);
        }

        .legend-swatch {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }
    </style>
</head>

                center: [26.9124, 75.7873],
                isActive: true,
                boundary: [
                    [27.020, 75.700], [27.040, 75.760], [27.030, 75.840],
                    [26.990, 75.900], [26.940, 75.920], [26.880, 75.890],
                    [26.840, 75.820], [26.850, 75.730], [26.890, 75.670],
                    [26.940, 75.650], [26.990, 75.660], [27.020, 75.700]
                ],
                zones: [
                    { h3Index: "8730e1c4fffffff", isActive: true, status: "active", label: "Malviya Nagar", demand: 85, supply: 81, boundary: [[26.860, 75.800], [26.870, 75.808], [26.865, 75.819], [26.853, 75.818], [26.848, 75.807], [26.854, 75.799]] },
                    { h3Index: "8730e1c41ffffff", isActive: true, status: "active", label: "C-Scheme", demand: 90, supply: 88, boundary: [[26.908, 75.801], [26.918, 75.809], [26.913, 75.820], [26.901, 75.819], [26.896, 75.808], [26.902, 75.800]] },
                    { h3Index: "8730e1c43ffffff", isActive: false, status: "inactive", label: "Mansarovar", demand: 0, supply: 0, boundary: [[26.865, 75.760], [26.875, 75.768], [26.870, 75.779], [26.858, 75.778], [26.853, 75.767], [26.859, 75.759]] },
                    { h3Index: "8730e1c45ffffff", isActive: true, status: "partial", label: "Vaishali Nagar", demand: 55, supply: 42, boundary: [[26.920, 75.742], [26.930, 75.750], [26.925, 75.761], [26.913, 75.760], [26.908, 75.749], [26.914, 75.741]] },
                    { h3Index: "8730e1c47ffffff", isActive: true, status: "active", label: "Tonk Road", demand: 70, supply: 66, boundary: [[26.873, 75.820], [26.883, 75.828], [26.878, 75.839], [26.866, 75.838], [26.861, 75.827], [26.867, 75.819]] },
                    { h3Index: "8730e1c49ffffff", isActive: true, status: "active", label: "Pink City", demand: 93, supply: 90, boundary: [[26.922, 75.813], [26.932, 75.821], [26.927, 75.832], [26.915, 75.831], [26.910, 75.820], [26.916, 75.812]] },
                ]
            },
            {
                id: "city_nagpur",
                name: "Nagpur",
                state: "Maharashtra",
                center: [21.1458, 79.0882],
                isActive: true,
                boundary: [
                    [21.230, 79.020], [21.250, 79.060], [21.245, 79.130],
                    [21.210, 79.170], [21.160, 79.180], [21.110, 79.150],
                    [21.080, 79.090], [21.090, 79.020], [21.130, 78.970],
                    [21.180, 78.960], [21.220, 78.980], [21.230, 79.020]
                ],
                zones: [
                    { h3Index: "870e57803ffffff", isActive: true, status: "active", label: "Dharampeth", demand: 80, supply: 76, boundary: [[21.148, 79.073], [21.158, 79.081], [21.153, 79.092], [21.141, 79.091], [21.136, 79.080], [21.142, 79.072]] },
                    { h3Index: "870e57805ffffff", isActive: true, status: "active", label: "Sitabuldi", demand: 87, supply: 84, boundary: [[21.148, 79.088], [21.158, 79.096], [21.153, 79.107], [21.141, 79.106], [21.136, 79.095], [21.142, 79.087]] },
                    { h3Index: "870e57807ffffff", isActive: false, status: "inactive", label: "Itwari", demand: 0, supply: 0, boundary: [[21.162, 79.103], [21.172, 79.111], [21.167, 79.122], [21.155, 79.121], [21.150, 79.110], [21.156, 79.102]] },
                    { h3Index: "870e57809ffffff", isActive: true, status: "partial", label: "Wardha Road", demand: 40, supply: 25, boundary: [[21.100, 79.085], [21.110, 79.093], [21.105, 79.104], [21.093, 79.103], [21.088, 79.092], [21.094, 79.084]] },
                    { h3Index: "870e5780bffffff", isActive: true, status: "active", label: "Sadar", demand: 74, supply: 71, boundary: [[21.162, 79.073], [21.172, 79.081], [21.167, 79.092], [21.155, 79.091], [21.150, 79.080], [21.156, 79.072]] },
                ]
            }
        ];

        // ────────────────────────────────────────────────────
        // MAP INIT
        // ────────────────────────────────────────────────────

        const map = L.map('map', { zoomControl: false }).setView([22.9, 78.5], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ────────────────────────────────────────────────────
        // STATE
        // ────────────────────────────────────────────────────

        let currentFilter = 'all';
        let selectedCityId = null;
        const layerGroups = {}; // cityId -> { boundary, zones: [layers] }

        // ────────────────────────────────────────────────────
        // RENDER
        // ────────────────────────────────────────────────────

        function colorForZone(zone) {
            if (zone.status === 'active') return '#10b981';
            if (zone.status === 'inactive') return '#f43f5e';
            return '#f59e0b';
        }

        function shouldShowZone(zone) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'active') return zone.isActive;
            if (currentFilter === 'inactive') return !zone.isActive;
            return true;
        }

        function renderAll() {
            // Clear existing layers
            Object.values(layerGroups).forEach(g => {
                g.boundary.remove();
                g.zones.forEach(l => l.remove());
            });

            CITIES.forEach(city => {
                // City boundary
                const boundaryLayer = L.polygon(city.boundary, {
                    color: '#38bdf8',
                    fillColor: '#38bdf8',
                    fillOpacity: city.isActive ? 0.03 : 0.01,
                    weight: 1.5,
                    dashArray: '6, 4'
                }).addTo(map).bindPopup(`
            <b style="color:#38bdf8">${city.name}</b><br>
            <span style="color:#64748b">${city.state}</span><br>
            Status: <b>${city.isActive ? '<span style="color:#10b981">Active</span>' : '<span style="color:#f43f5e">Inactive</span>'}</b>
        `);

                // Zones
                const zoneLayers = [];
                city.zones.forEach(zone => {
                    if (!shouldShowZone(zone)) return;
                    const color = colorForZone(zone);
                    const layer = L.polygon(zone.boundary, {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.25,
                        weight: 1
                    }).addTo(map);

                    layer.on('click', () => showDetail(zone, city));
                    layer.on('mouseover', function () {
                        this.setStyle({ fillOpacity: 0.45, weight: 2 });
                    });
                    layer.on('mouseout', function () {
                        this.setStyle({ fillOpacity: 0.25, weight: 1 });
                    });

                    zoneLayers.push(layer);
                });

                layerGroups[city.id] = { boundary: boundaryLayer, zones: zoneLayers };
            });
        }

        // ────────────────────────────────────────────────────
        // SIDEBAR
        // ────────────────────────────────────────────────────

        function buildSidebar() {
            const list = document.getElementById('city-list');
            list.innerHTML = '';

            let totalZones = 0, totalActive = 0;

            CITIES.forEach(city => {
                const activeZones = city.zones.filter(z => z.isActive).length;
                const pct = Math.round((activeZones / city.zones.length) * 100);
                totalZones += city.zones.length;
                totalActive += activeZones;

                const cityStatus = !city.isActive ? 'inactive' : pct === 100 ? 'active' : 'partial';

                const item = document.createElement('div');
                item.className = 'city-item';
                item.dataset.cityId = city.id;
                item.innerHTML = `
            <div class="city-name">
                ${city.name}
                <span class="city-badge badge-${cityStatus}">${cityStatus}</span>
            </div>
            <div class="city-meta">
                <span>${city.zones.length} zones</span>
                <span style="color:${colorForZone({ status: cityStatus })}">${activeZones} active</span>
                <span>${city.state}</span>
            </div>
            <div class="zone-bar">
                <div class="zone-fill" style="width:${pct}%"></div>
            </div>
        `;

                item.addEventListener('click', () => flyToCity(city));
                list.appendChild(item);
            });

            document.getElementById('stat-cities').textContent = CITIES.length;
            document.getElementById('stat-zones').textContent = totalZones;
            const coverage = Math.round((totalActive / totalZones) * 100);
            document.getElementById('stat-active').textContent = coverage + '%';
        }

        function flyToCity(city) {
            map.flyTo(city.center, 13, { duration: 1.2 });
            selectedCityId = city.id;
            document.querySelectorAll('.city-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.cityId === city.id);
            });
        }

        // ────────────────────────────────────────────────────
        // DETAIL PANEL
        // ────────────────────────────────────────────────────

        function showDetail(zone, city) {
            const panel = document.getElementById('detail-panel');
            document.getElementById('detail-h3').textContent = zone.h3Index;

            const statusColor = colorForZone(zone);
            const rows = [
                ['Label', zone.label],
                ['City', city.name],
                ['Status', `<span style="color:${statusColor};font-weight:700">${zone.status.toUpperCase()}</span>`],
                ['H3 Resolution', 'r7'],
                ['Demand Score', zone.isActive ? zone.demand + '%' : '—'],
                ['Supply Score', zone.isActive ? zone.supply + '%' : '—'],
            ];

            document.getElementById('detail-body').innerHTML = rows.map(([k, v]) => `
        <div class="detail-row">
            <span class="detail-key">${k}</span>
            <span class="detail-val">${v}</span>
        </div>
    `).join('');

            panel.style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('detail-panel').style.display = 'none';
        }

        // ────────────────────────────────────────────────────
        // FILTER
        // ────────────────────────────────────────────────────

        function setFilter(btn, filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAll();
        }

        // ────────────────────────────────────────────────────
        // BOOT
        // ────────────────────────────────────────────────────

        buildSidebar();
        renderAll();
    </script>
</body>

</html>
